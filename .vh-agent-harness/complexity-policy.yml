version: 1
enabled: false

defaults:
  event_file_lines: 350
  snapshot_file_lines: 500

per_language:
  ".go": {}
  ".cjs": {}
  ".cts": {}
  ".js": {}
  ".jsx": {}
  ".mjs": {}
  ".mts": {}
  ".py": {}
  ".ts": {}
  ".tsx": {}

exclude:
  event_paths:
    - ".git/**"
    - ".opencode/state/**"
    - "**/__pycache__/**"
    - "**/node_modules/**"
    - "tmp/**"

  snapshot_paths:
    - ".git/**"
    - ".opencode/**"
    # templates/core/.opencode/** is the go:embed embedded-source mirror of the
    # rendered .opencode/** tree (byte-identical; diff exit=0). Both are
    # harness-release-managed artifacts, not project refactor targets, so both
    # are excluded for consistency. No-op for consumers (no templates/core/).
    - "templates/core/.opencode/**"
    - "**/__pycache__/**"
    - "**/node_modules/**"
    - "tmp/**"

  snapshot_suffixes:
    - "_test.go"

doctor:
  max_candidates: 10

recurrence:
  enabled: false
