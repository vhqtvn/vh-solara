version: 1
enabled: true
defaults:
    event_file_lines: 350
    snapshot_file_lines: 500
per_language:
    .cjs: {}
    .cts: {}
    .go: {}
    .js: {}
    .jsx: {}
    .mjs: {}
    .mts: {}
    .py: {}
    .ts: {}
    .tsx: {}
exclude:
    event_paths:
        - '**/__pycache__/**'
        - '**/node_modules/**'
        - .git/**
        - .opencode/**
        - .opencode/state/**
        - pkg/web/dist/**
        - refs/**
        - tmp/**
    snapshot_paths:
        - '**/__pycache__/**'
        - '**/node_modules/**'
        - .git/**
        - .opencode/**
        - pkg/web/dist/**
        - refs/**
        - templates/core/.opencode/**
        - tmp/**
    snapshot_suffixes:
        - _test.go
doctor:
    max_candidates: 10
recurrence:
    enabled: false
