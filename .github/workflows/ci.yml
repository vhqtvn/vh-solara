name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly at 04:17 UTC (off-peak; non-round-number to spread GitHub Actions load).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Changeset gate (push-safety Phase 4). Only `push` events can skip code
  # lanes; pull_request / schedule / workflow_dispatch always run everything.
  #
  # Why a hand-rolled detection job instead of `on.push.paths`: workflow path
  # filters are glob-only and cannot express the precedence-aware docs class
  # shared with scripts/prepush-check.sh (there, web/README.md is a WEB
  # change, not docs — yet it matches a `**/*.md` glob), and a path-filtered
  # *workflow* is the one shape GitHub documents as leaving required checks
  # stuck "Pending" (docs.github.com — "Troubleshooting required status
  # checks": skipped workflow → checks Pending → merge blocked). A job skipped
  # by a conditional instead reports "Success", and this gate never skips
  # lanes on non-push events at all. No third-party action: pinned checkout
  # only, same SHA as every other job in this file.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: ${{ github.event_name == 'push' }}
        with:
          # The diff base is github.event.before — for a batched push it can
          # sit any number of commits back, so fetch full history to
          # guarantee it exists locally (worst case below: run all lanes).
          fetch-depth: 0
      - name: classify the push changeset
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Note on -e: GitHub runs bash steps with -e by default. Every
          # failure-capable command below (git cat-file, git diff, is_docs)
          # sits inside a condition position, so each foreseen path reaches
          # an explicit exit 0 with outputs written. If the gate ever dies
          # anyway, its outputs stay unset and the consumers' != 'false'
          # check reads that as run-everything on every event -- a broken
          # gate degrades to today's behavior, never a silent skip. Default
          # verdict is RUN (code=true); only a fully observed, provably
          # docs-only push flips it to false.
          code=true
          reason="unclassified (default: run)"

          # docs-class mirror of scripts/prepush-check.sh classify() -- same
          # first-match-wins order, collapsed to "docs or not":
          #   lockfile basenames / *.go / web/ / host-web/ / tooling dirs /
          #     tooling basenames -> NOT docs
          #   docs/ , researches/ , docs name suffixes (*.md *.txt *.rst
          #     *.adoc LICENSE* COPYING* NOTICE* CHANGELOG*) -> docs
          #   anything else -> NOT docs (unknown => run, conservative)
          # Keep the order in sync with prepush-check.sh classify().
          is_docs() {
            b="${1##*/}"
            case "$b" in
              go.mod|go.sum|package.json|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml) return 1 ;;
            esac
            case "$1" in
              *.go|web/*|host-web/*|scripts/*|.github/*|.githooks/*|.opencode/*|.vh-agent-harness/*|tests/*|tools/*|docker/*) return 1 ;;
              docs/*|researches/*) return 0 ;;
            esac
            case "$b" in
              Makefile|makefile|*.mk|Dockerfile*|.dockerignore|opencode.jsonc|.gitignore|.gitattributes|.editorconfig|*.sh|*.py|*.yml|*.yaml|*.toml|*.jsonc) return 1 ;;
              *.md|*.txt|*.rst|*.adoc|LICENSE*|COPYING*|NOTICE*|CHANGELOG*) return 0 ;;
            esac
            return 1
          }

          if [ "$EVENT_NAME" != "push" ]; then
            reason="non-push event ($EVENT_NAME): code lanes always run"
          else
            ZERO=0000000000000000000000000000000000000000
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
              reason="push without before SHA (new branch): run all lanes"
            elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              reason="before $BEFORE missing from clone: run all lanes"
            elif ! DIFF="$(git diff --name-status --find-renames "$BEFORE" "$AFTER" 2>/dev/null)"; then
              reason="git diff failed: run all lanes"
            else
              total=0
              docs=0
              first_code=""
              TAB="$(printf '\t')"
              while IFS="$TAB" read -r st pa pb; do
                [ -n "${st:-}" ] || continue
                total=$((total+1))
                ok=0
                case "$st" in
                  R*|C*)
                    # Mirrors prepush-check.sh: a rename/copy counts as docs
                    # only when BOTH sides are docs-class.
                    if is_docs "$pa" && is_docs "$pb"; then ok=1; fi
                    ;;
                  *)
                    if is_docs "$pa"; then ok=1; fi
                    ;;
                esac
                if [ "$ok" -eq 1 ]; then
                  docs=$((docs+1))
                elif [ -z "$first_code" ]; then
                  first_code="$st $pa${pb:+ -> $pb}"
                fi
              done < <(printf '%s\n' "$DIFF")
              echo "changeset: $total entries, $docs docs-class; first non-docs: ${first_code:-none}"
              if [ "$total" -gt 0 ] && [ "$docs" -eq "$total" ]; then
                code=false
                reason="docs-only push ($total entries): skip code lanes"
              else
                reason="push with code changes ($((total-docs)) non-docs of $total): run all lanes"
              fi
            fi
          fi

          echo "changes-gate: code=$code -- $reason"
          {
            echo "code=$code"
            echo "reason=$reason"
          } >>"$GITHUB_OUTPUT"
          exit 0

  go:
    needs: [changes]
    # Push-safety Phase 4: only push events can skip this lane, and only when
    # the changes gate SUCCEEDED and explicitly wrote code=false (proven
    # docs-only). Unset/missing/garbage gate output runs the lane, so a
    # failed or broken gate degrades to today's run-everything behavior,
    # never a silent skip. !cancelled() both neutralizes the implicit
    # success() status check (a failed `changes` job can never skip
    # PR/schedule/dispatch lanes) and avoids always()-style post-cancel
    # zombie runs.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          files="$(gofmt -l pkg cmd main.go)"
          if [ -n "$files" ]; then
            echo "These files are not gofmt-clean:"; echo "$files"
            echo "Run: gofmt -w pkg cmd main.go"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          # Customer-token deny-list for TestGenerateHasNoBannedTokens.
          # ADVISORY / OPT-IN (post-B1): the test SKIPS when this var is
          # unset, regardless of CI context — it never fails loud. Set the
          # secret locally or in a release-prep run to enforce the
          # customer-token deny-list scan. The secret VALUE is out-of-band
          # (never committed in source); the env-var NAME carries no
          # customer token. Resolves empty when no secret is configured →
          # the test skips harmlessly.
          VH_SKILL_BANNED_TOKENS: ${{ secrets.VH_SKILL_BANNED_TOKENS }}
        # Timing visibility (docs/ai/test-runtime-budget.md): shell: bash
        # gives -eo pipefail so `| tee` cannot swallow a failure; the
        # `|| status=$?` wrapper records the duration even on red runs
        # before re-raising the exit code.
        shell: bash
        run: |
          mkdir -p tmp/timing-summaries
          t=$SECONDS
          status=0
          go test ./... 2>&1 | tee tmp/timing-summaries/go-test.log || status=$?
          echo "GO_TEST_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
          exit "$status"
      - name: timing summary
        # Advisory visibility only — never a pass/fail gate on wall-clock.
        if: ${{ !cancelled() }}
        run: |
          pkgs=$(grep -c '^ok ' tmp/timing-summaries/go-test.log || true)
          secs=${GO_TEST_SECS:-unknown}
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          ## Timing — go
          - go test ./... body: ${secs}s
          - packages ok: ${pkgs}
          EOF
          recorded=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > tmp/timing-summaries/go.json <<EOF
          {
            "job": "go",
            "lane": "go test ./... (Go lanes 1-3)",
            "engine": "n/a",
            "steps": { "go_test_secs": "${secs}" },
            "counts": { "packages_ok": "${pkgs}" },
            "runner_class": "github-hosted-ubuntu-latest",
            "command": "go test ./...",
            "build_mode": "fresh",
            "event": "${GITHUB_EVENT_NAME}",
            "commit": "${GITHUB_SHA}",
            "recorded_at": "${recorded}"
          }
          EOF
      - name: upload timing summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per-job suffix: upload-artifact v4+ rejects duplicate artifact
          # names within a run, so a shared bare "timing-summaries" name
          # would fail on the second job's upload.
          name: timing-summaries-go
          # DELIBERATELY go.json ONLY, never go-test.log: the banned-token
          # deny-list test (VH_SKILL_BANNED_TOKENS, wired above) prints the
          # matched secret-derived token on failure, and GitHub's automatic
          # secret masking covers the LIVE log, not uploaded artifact files
          # — a raw-log upload would exfiltrate the token exactly on the red
          # run that reports it (commit-review tier1_c-F1). The parsed count
          # lives in go.json; the live (masked) log remains in the run view.
          path: tmp/timing-summaries/go.json
          retention-days: 14
          if-no-files-found: warn

  web:
    needs: [changes]
    # Push-safety Phase 4 (see the `go` job comment): push-only skip.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck
        # Timing visibility (docs/ai/test-runtime-budget.md); see the go job
        # note on shell: bash + `|| status=$?`.
        shell: bash
        run: |
          mkdir -p ../tmp/timing-summaries
          t=$SECONDS
          status=0
          npm run typecheck 2>&1 | tee ../tmp/timing-summaries/web-typecheck.log || status=$?
          echo "WEB_TYPECHECK_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
          exit "$status"
      - name: unit tests
        shell: bash
        run: |
          mkdir -p ../tmp/timing-summaries
          t=$SECONDS
          status=0
          npm run test:unit 2>&1 | tee ../tmp/timing-summaries/web-unit.log || status=$?
          echo "WEB_UNIT_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
          exit "$status"
      - name: build
        shell: bash
        run: |
          mkdir -p ../tmp/timing-summaries
          t=$SECONDS
          status=0
          npm run build 2>&1 | tee ../tmp/timing-summaries/web-build.log || status=$?
          echo "WEB_BUILD_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
          exit "$status"
      - name: guard — make web leaves no tracked dist changes
        # `npm run build` must stage into the gitignored web/dist-build/ and NEVER
        # dirty the tracked fallback placeholder pkg/web/dist/placeholder.html. If
        # it does, the Vite outDir / materialize contract has regressed.
        working-directory: .
        run: |
          if ! git diff --exit-code -- pkg/web/dist/placeholder.html; then
            echo "::error::npm run build dirtied the tracked placeholder pkg/web/dist/placeholder.html."
            echo "The SPA build must write to the gitignored staging dir (web/dist-build), not pkg/web/dist."
            git --no-pager diff -- pkg/web/dist/placeholder.html
            exit 1
          fi
      - name: timing summary
        # Advisory visibility only — never a pass/fail gate on wall-clock.
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          unit_tests=$(grep -oE 'Tests[[:space:]]+[0-9]+' tmp/timing-summaries/web-unit.log | tail -1 | grep -oE '[0-9]+' || echo unknown)
          unit_files=$(grep -oE 'Test Files[[:space:]]+[0-9]+' tmp/timing-summaries/web-unit.log | tail -1 | grep -oE '[0-9]+' || echo unknown)
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          ## Timing — web
          - typecheck: ${WEB_TYPECHECK_SECS:-unknown}s
          - unit tests: ${WEB_UNIT_SECS:-unknown}s (tests: ${unit_tests}, files: ${unit_files})
          - build: ${WEB_BUILD_SECS:-unknown}s
          EOF
          recorded=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > tmp/timing-summaries/web.json <<EOF
          {
            "job": "web",
            "lane": "web typecheck/unit/build (lane 5)",
            "engine": "n/a",
            "steps": {
              "typecheck_secs": "${WEB_TYPECHECK_SECS:-unknown}",
              "unit_secs": "${WEB_UNIT_SECS:-unknown}",
              "build_secs": "${WEB_BUILD_SECS:-unknown}"
            },
            "counts": { "unit_tests": "${unit_tests}", "unit_files": "${unit_files}" },
            "runner_class": "github-hosted-ubuntu-latest",
            "command": "npm run typecheck && npm run test:unit && npm run build",
            "build_mode": "fresh",
            "event": "${GITHUB_EVENT_NAME}",
            "commit": "${GITHUB_SHA}",
            "recorded_at": "${recorded}"
          }
          EOF
      - name: upload timing summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per-job suffix — upload-artifact v4+ forbids duplicate names per run.
          name: timing-summaries-web
          path: tmp/timing-summaries
          retention-days: 14
          if-no-files-found: warn

  # Fixture-backed Playwright e2e. Needs Go too — the Playwright webServer builds
  # the SPA and runs ./tools/fixtureserver (real aggregator + fake OpenCode).
  e2e:
    needs: [changes]
    # Push-safety Phase 4 (see the `go` job comment): push-only skip.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install deps
        working-directory: web
        run: npm ci
      - name: install Playwright browser
        working-directory: web
        run: |
          t=$SECONDS
          npx playwright install --with-deps chromium firefox
          echo "WEB_E2E_INSTALL_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
      - name: e2e
        # Timing visibility (docs/ai/test-runtime-budget.md); see the go job
        # note on shell: bash + `|| status=$?`.
        working-directory: web
        shell: bash
        run: |
          mkdir -p ../tmp/timing-summaries
          t=$SECONDS
          status=0
          npm run test:e2e 2>&1 | tee ../tmp/timing-summaries/e2e.log || status=$?
          echo "WEB_E2E_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
          exit "$status"
      - name: timing summary
        # Advisory visibility only — never a pass/fail gate on wall-clock.
        if: ${{ !cancelled() }}
        run: |
          passed=$(grep -oE '[0-9]+ passed' tmp/timing-summaries/e2e.log | tail -1 | grep -oE '^[0-9]+' || echo unknown)
          failed=$(grep -oE '[0-9]+ failed' tmp/timing-summaries/e2e.log | tail -1 | grep -oE '^[0-9]+' || echo 0)
          flaky=$(grep -oE '[0-9]+ flaky' tmp/timing-summaries/e2e.log | tail -1 | grep -oE '^[0-9]+' || echo 0)
          skipped=$(grep -oE '[0-9]+ skipped' tmp/timing-summaries/e2e.log | tail -1 | grep -oE '^[0-9]+' || echo 0)
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          ## Timing — e2e (web Playwright)
          - browser install: ${WEB_E2E_INSTALL_SECS:-unknown}s
          - e2e run: ${WEB_E2E_SECS:-unknown}s (chromium+firefox, workers:1, fresh fixture boot)
          - outcome: ${passed} passed / ${failed} failed / ${flaky} flaky / ${skipped} skipped (parsed from list reporter; raw log in artifact)
          EOF
          recorded=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > tmp/timing-summaries/e2e.json <<EOF
          {
            "job": "e2e",
            "lane": "web Playwright e2e (lane 6)",
            "engine": "chromium+firefox",
            "steps": {
              "browser_install_secs": "${WEB_E2E_INSTALL_SECS:-unknown}",
              "e2e_secs": "${WEB_E2E_SECS:-unknown}"
            },
            "counts": { "passed": "${passed}", "failed": "${failed}", "flaky": "${flaky}", "skipped": "${skipped}" },
            "runner_class": "github-hosted-ubuntu-latest",
            "command": "npm run test:e2e",
            "build_mode": "fresh (SPA build + fixtureserver compile in webServer boot)",
            "event": "${GITHUB_EVENT_NAME}",
            "commit": "${GITHUB_SHA}",
            "recorded_at": "${recorded}"
          }
          EOF
      - name: upload timing summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per-job suffix — upload-artifact v4+ forbids duplicate names per run.
          name: timing-summaries-e2e
          path: tmp/timing-summaries
          retention-days: 14
          if-no-files-found: warn
      - name: upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e
          # Coupled to web/playwright.config.ts `artifactRoot` (default
          # tmp/agent-runs/playwright, overridable via PLAYWRIGHT_ARTIFACTS_DIR).
          # If that root changes or PLAYWRIGHT_ARTIFACTS_DIR is set in CI, update
          # this path to match or the upload will miss the artifacts.
          path: tmp/agent-runs/playwright
          retention-days: 14
          # warn (not ignore) so a missing artifact root surfaces instead of
          # silently passing — an empty upload usually means the e2e step never
          # produced output or the artifactRoot above has drifted.
          if-no-files-found: warn

  # host-web Playwright e2e — the multi-server host SPA (SolidJS/Dockview shell
  # embedding cross-origin iframes). Runs two disjoint suites that self-bootstrap
  # their own servers via the Playwright webServer config:
  #   1. tests/e2e        — iframe survival + shell ops against vite DEV servers
  #                         (:5173 host, :5174 iframe, :5175 ws-echo).
  #   2. tests/preview-e2e — production-build shell proof against `vite preview`
  #                         (asserts window.__host is absent in a real bundle).
  # No Go, no fixtureserver — disjoint from the Go/web jobs above.
  host-web-e2e:
    needs: [changes]
    # Push-safety Phase 4 (see the `go` job comment): push-only skip.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: host-web/package-lock.json
      - run: npm ci
      - name: install Playwright browsers
        run: |
          t=$SECONDS
          npx playwright install --with-deps chromium firefox webkit
          echo "HW_INSTALL_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
      - name: host-web e2e (iframe survival + shell, DEV servers)
        # Timing visibility (docs/ai/test-runtime-budget.md); see the go job
        # note on shell: bash + `|| status=$?`.
        shell: bash
        run: |
          mkdir -p ../tmp/timing-summaries
          t=$SECONDS
          status=0
          npm run test:e2e 2>&1 | tee ../tmp/timing-summaries/host-web-e2e.log || status=$?
          echo "HW_E2E_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
          exit "$status"
      - name: host-web e2e (production-build shell proof, vite preview)
        shell: bash
        run: |
          mkdir -p ../tmp/timing-summaries
          t=$SECONDS
          status=0
          npm run test:e2e:preview 2>&1 | tee ../tmp/timing-summaries/host-web-preview.log || status=$?
          echo "HW_PREVIEW_SECS=$((SECONDS - t))" >> "$GITHUB_ENV"
          exit "$status"
      - name: timing summary
        # Advisory visibility only — never a pass/fail gate on wall-clock.
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          hw_pass=$(grep -oE '[0-9]+ passed' tmp/timing-summaries/host-web-e2e.log | tail -1 | grep -oE '^[0-9]+' || echo unknown)
          hw_fail=$(grep -oE '[0-9]+ failed' tmp/timing-summaries/host-web-e2e.log | tail -1 | grep -oE '^[0-9]+' || echo 0)
          pv_pass=$(grep -oE '[0-9]+ passed' tmp/timing-summaries/host-web-preview.log | tail -1 | grep -oE '^[0-9]+' || echo unknown)
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          ## Timing — host-web-e2e
          - browser install: ${HW_INSTALL_SECS:-unknown}s
          - DEV e2e: ${HW_E2E_SECS:-unknown}s (chromium+firefox+webkit, workers:1, self-bootstrapped servers)
          - preview e2e: ${HW_PREVIEW_SECS:-unknown}s (chromium+firefox)
          - outcome: DEV ${hw_pass} passed / ${hw_fail} failed; preview ${pv_pass} passed (parsed from list reporter; raw logs in artifact)
          EOF
          recorded=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > tmp/timing-summaries/host-web-e2e.json <<EOF
          {
            "job": "host-web-e2e",
            "lane": "host-web Playwright e2e (lane 7 + 7b preview)",
            "engine": "chromium+firefox+webkit",
            "steps": {
              "browser_install_secs": "${HW_INSTALL_SECS:-unknown}",
              "dev_e2e_secs": "${HW_E2E_SECS:-unknown}",
              "preview_e2e_secs": "${HW_PREVIEW_SECS:-unknown}"
            },
            "counts": { "dev_passed": "${hw_pass}", "dev_failed": "${hw_fail}", "preview_passed": "${pv_pass}" },
            "runner_class": "github-hosted-ubuntu-latest",
            "command": "npm run test:e2e && npm run test:e2e:preview",
            "build_mode": "fresh (self-bootstrapped vite dev/preview servers)",
            "event": "${GITHUB_EVENT_NAME}",
            "commit": "${GITHUB_SHA}",
            "recorded_at": "${recorded}"
          }
          EOF
      - name: upload timing summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per-job suffix — upload-artifact v4+ forbids duplicate names per run.
          name: timing-summaries-host-web-e2e
          path: tmp/timing-summaries
          retention-days: 14
          if-no-files-found: warn
      - name: upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-host-web-e2e
          # Covers both artifact roots, set in host-web/playwright.config.ts
          # (tmp/agent-runs/host-web-playwright) and playwright.preview.config.ts
          # (tmp/agent-runs/host-web-playwright-preview); overridable via
          # PLAYWRIGHT_ARTIFACTS_DIR. upload-artifact is a `uses:` step, so
          # defaults.run.working-directory does NOT apply — paths are repo-root-relative.
          path: |
            tmp/agent-runs/host-web-playwright
            tmp/agent-runs/host-web-playwright-preview
          retention-days: 14
          if-no-files-found: warn

  # host-web REAL-EMBEDDING e2e — LANE 8. The FIRST host-web lane to embed the
  # REAL production web/ SPA (built + materialized into pkg/web/dist/, served by
  # a real local-server binary) instead of the mock content page. Boots a real Go
  # server (:8765, --auth-mode none loopback default, --frame-ancestors) + the
  # host dev server (:5183, VITE_IFRAME_ORIGIN=:8765) cross-origin. Asserts: the
  # live production heartbeat emitter (web/src/heartbeat.ts) drives the host's
  # Q1-C "document alive" indicator, real SPA render, real SSE connect, and
  # iframe survival across a Dockview split. Heavier than the mock survival gate.
  #
  # SCHEDULED/DISPATCHABLE ONLY — NOT in the push/PR matrix. The `if:` guard
  # restricts this job to schedule/workflow_dispatch; it is additive to the
  # PR-blocking mock survival gate (host-web-e2e above), which stays untouched.
  # Adding schedule/workflow_dispatch to the workflow `on:` also gives the
  # existing jobs a nightly run (additive — their push/PR behavior is unchanged).
  host-web-real-embed:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            host-web/package-lock.json
      - name: build web/ SPA (into gitignored web/dist-build/)
        working-directory: web
        run: npm ci && npm run build
      - name: materialize SPA into pkg/web/dist (the //go:embed path)
        run: bash web/scripts/materialize.sh
      - name: build vh-solara binaries (real server + fake-only fixtureserver)
        # setup-go puts go on PATH; the export is belt-and-suspenders (matches
        # the AGENTS convention for local runs where go may not be on PATH).
        # The fixtureserver binary backs the lane's controllable fake upstream
        # (playwright.real-embed.config.ts webServer[0], -fake-only).
        run: |
          export PATH="$PATH:/usr/local/go/bin"
          go build -o vh-solara .
          go build -o vh-solara-fixtureserver ./tools/fixtureserver
      - name: install host-web deps
        working-directory: host-web
        run: npm ci
      - name: install Playwright browsers
        working-directory: host-web
        run: npx playwright install --with-deps chromium firefox
      - name: real-embed e2e (real SPA embedded cross-origin; no-auth local-server)
        # The webServer config boots the real :8765 server + host :5183 dev
        # server and tears them down on exit. CI=true (set by GitHub Actions)
        # makes Playwright boot fresh servers (reuseExistingServer: false).
        working-directory: host-web
        run: npx playwright test --config=playwright.real-embed.config.ts
      - name: upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-host-web-real-embed
          # Covers the artifact root set in host-web/playwright.real-embed.config.ts
          # (tmp/agent-runs/host-web-real-embed); overridable via PLAYWRIGHT_ARTIFACTS_DIR.
          # upload-artifact is a `uses:` step, so paths are repo-root-relative.
          path: tmp/agent-runs/host-web-real-embed
          retention-days: 14
          if-no-files-found: warn

  # Stable aggregate (push-safety Phase 4): runs for every event; red iff any
  # lane that executed went red. Lane skips are legitimate — they only happen
  # on push events (changes-gate) and on the real-embed event guard, neither
  # of which carries merge-gate semantics. If branch protection wants a single
  # required check instead of per-lane ones, require "CI / ci-summary".
  # !cancelled() (GitHub's recommended alternative to always()) both lets this
  # job run when a needed job was skipped or failed and avoids post-cancel
  # zombie runs.
  ci-summary:
    needs: [changes, go, web, e2e, host-web-e2e, host-web-real-embed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: fail if any executed lane failed
        env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.go.result }}
          WEB: ${{ needs.web.result }}
          E2E: ${{ needs.e2e.result }}
          HOST_WEB_E2E: ${{ needs['host-web-e2e'].result }}
          REAL_EMBED: ${{ needs['host-web-real-embed'].result }}
        run: |
          status=0
          check() {
            case "$2" in
              success|skipped) echo "  $1: $2" ;;
              *) echo "::error::$1 result: $2"; status=1 ;;
            esac
          }
          check changes "$CHANGES"
          check go "$GO"
          check web "$WEB"
          check e2e "$E2E"
          check host-web-e2e "$HOST_WEB_E2E"
          check host-web-real-embed "$REAL_EMBED"
          exit "$status"
