name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          files="$(gofmt -l pkg cmd main.go)"
          if [ -n "$files" ]; then
            echo "These files are not gofmt-clean:"; echo "$files"
            echo "Run: gofmt -w pkg cmd main.go"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          # Customer-token deny-list for TestGenerateHasNoBannedTokens. The
          # secret VALUE is out-of-band (never committed in source); the env-var
          # NAME carries no customer token. The deny-list FAILS LOUD only in
          # trusted CI contexts (push / same-repo PR) where the secret is
          # available. Fork PRs are exempt because GitHub intentionally
          # withholds repository secrets from pull_request events that
          # originate from forks — without the trust gate, every external fork
          # PR would be permanently red (the secret resolves to empty and the
          # fail-loud branch fires). CI enforcement of the deny-list begins
          # once the operator creates the VH_SKILL_BANNED_TOKENS repo secret.
          VH_SKILL_BANNED_TOKENS: ${{ secrets.VH_SKILL_BANNED_TOKENS }}
          # Trust signal for the deny-list test: true on push events and
          # same-repo PRs (secret available), false on fork PRs (secret
          # withheld). The || short-circuits so github.event.pull_request is
          # never dereferenced on non-PR events. GitHub Actions coerces the
          # boolean expression result to the string "true"/"false".
          VH_CI_TRUSTED: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm run test:unit
      - name: build
        run: npm run build
      - name: guard — make web leaves no tracked dist changes
        # `npm run build` must stage into the gitignored web/dist-build/ and NEVER
        # dirty the tracked fallback placeholder pkg/web/dist/placeholder.html. If
        # it does, the Vite outDir / materialize contract has regressed.
        working-directory: .
        run: |
          if ! git diff --exit-code -- pkg/web/dist/placeholder.html; then
            echo "::error::npm run build dirtied the tracked placeholder pkg/web/dist/placeholder.html."
            echo "The SPA build must write to the gitignored staging dir (web/dist-build), not pkg/web/dist."
            git --no-pager diff -- pkg/web/dist/placeholder.html
            exit 1
          fi

  # Fixture-backed Playwright e2e. Needs Go too — the Playwright webServer builds
  # the SPA and runs ./tools/fixtureserver (real aggregator + fake OpenCode).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install deps
        working-directory: web
        run: npm ci
      - name: install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: e2e
        working-directory: web
        run: npm run test:e2e
      - name: upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e
          # Coupled to web/playwright.config.ts `artifactRoot` (default
          # tmp/agent-runs/playwright, overridable via PLAYWRIGHT_ARTIFACTS_DIR).
          # If that root changes or PLAYWRIGHT_ARTIFACTS_DIR is set in CI, update
          # this path to match or the upload will miss the artifacts.
          path: tmp/agent-runs/playwright
          retention-days: 14
          # warn (not ignore) so a missing artifact root surfaces instead of
          # silently passing — an empty upload usually means the e2e step never
          # produced output or the artifactRoot above has drifted.
          if-no-files-found: warn
