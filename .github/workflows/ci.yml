name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          files="$(gofmt -l pkg cmd main.go)"
          if [ -n "$files" ]; then
            echo "These files are not gofmt-clean:"; echo "$files"
            echo "Run: gofmt -w pkg cmd main.go"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          # Customer-token deny-list for TestGenerateHasNoBannedTokens.
          # ADVISORY / OPT-IN (post-B1): the test SKIPS when this var is
          # unset, regardless of CI context — it never fails loud. Set the
          # secret locally or in a release-prep run to enforce the
          # customer-token deny-list scan. The secret VALUE is out-of-band
          # (never committed in source); the env-var NAME carries no
          # customer token. Resolves empty when no secret is configured →
          # the test skips harmlessly.
          VH_SKILL_BANNED_TOKENS: ${{ secrets.VH_SKILL_BANNED_TOKENS }}
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm run test:unit
      - name: build
        run: npm run build
      - name: guard — make web leaves no tracked dist changes
        # `npm run build` must stage into the gitignored web/dist-build/ and NEVER
        # dirty the tracked fallback placeholder pkg/web/dist/placeholder.html. If
        # it does, the Vite outDir / materialize contract has regressed.
        working-directory: .
        run: |
          if ! git diff --exit-code -- pkg/web/dist/placeholder.html; then
            echo "::error::npm run build dirtied the tracked placeholder pkg/web/dist/placeholder.html."
            echo "The SPA build must write to the gitignored staging dir (web/dist-build), not pkg/web/dist."
            git --no-pager diff -- pkg/web/dist/placeholder.html
            exit 1
          fi

  # Fixture-backed Playwright e2e. Needs Go too — the Playwright webServer builds
  # the SPA and runs ./tools/fixtureserver (real aggregator + fake OpenCode).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install deps
        working-directory: web
        run: npm ci
      - name: install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: e2e
        working-directory: web
        run: npm run test:e2e
      - name: upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e
          # Coupled to web/playwright.config.ts `artifactRoot` (default
          # tmp/agent-runs/playwright, overridable via PLAYWRIGHT_ARTIFACTS_DIR).
          # If that root changes or PLAYWRIGHT_ARTIFACTS_DIR is set in CI, update
          # this path to match or the upload will miss the artifacts.
          path: tmp/agent-runs/playwright
          retention-days: 14
          # warn (not ignore) so a missing artifact root surfaces instead of
          # silently passing — an empty upload usually means the e2e step never
          # produced output or the artifactRoot above has drifted.
          if-no-files-found: warn

  # host-web Playwright e2e — the multi-server host SPA (SolidJS/Dockview shell
  # embedding cross-origin iframes). Runs two disjoint suites that self-bootstrap
  # their own servers via the Playwright webServer config:
  #   1. tests/e2e        — iframe survival + shell ops against vite DEV servers
  #                         (:5173 host, :5174 iframe, :5175 ws-echo).
  #   2. tests/preview-e2e — production-build shell proof against `vite preview`
  #                         (asserts window.__host is absent in a real bundle).
  # No Go, no fixtureserver — disjoint from the Go/web jobs above.
  host-web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: host-web/package-lock.json
      - run: npm ci
      - name: install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: host-web e2e (iframe survival + shell, DEV servers)
        run: npm run test:e2e
      - name: host-web e2e (production-build shell proof, vite preview)
        run: npm run test:e2e:preview
      - name: upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-host-web-e2e
          # Covers both artifact roots, set in host-web/playwright.config.ts
          # (tmp/agent-runs/host-web-playwright) and playwright.preview.config.ts
          # (tmp/agent-runs/host-web-playwright-preview); overridable via
          # PLAYWRIGHT_ARTIFACTS_DIR. upload-artifact is a `uses:` step, so
          # defaults.run.working-directory does NOT apply — paths are repo-root-relative.
          path: |
            tmp/agent-runs/host-web-playwright
            tmp/agent-runs/host-web-playwright-preview
          retention-days: 14
          if-no-files-found: warn
